name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nodejs libglib2.0-dev shellcheck yamllint python3

      - name: metadata.json valid JSON
        run: python3 -c "import json; json.load(open('metadata.json'))"

      - name: All JS files parse as ES modules
        run: |
          for f in $(find . -name "*.js" -not -path "./.git/*"); do
            node --check "$f" || { echo "SYNTAX ERROR in $f"; exit 1; }
          done

      - name: Schema compiles
        run: glib-compile-schemas --strict schemas/

      - name: No old UUID references
        run: |
          if grep -r "spotlight@ninx" . --exclude-dir=.git --exclude-dir=.github; then
            echo "ERROR: found spotlight@ninx references"; exit 1; fi

      - name: Metadata checks
        run: python3 scripts/check-metadata.py

      - name: Process isolation
        run: |
          if grep -rn "from 'gi://Gtk'\|from 'gi://Gdk'\|from 'gi://Adw'" $(find . -name "*.js" -not -path "./.git/*" -not -path "./prefs/*" -not -name "prefs.js"); then
            echo "ERROR: shell files import GTK libs"; exit 1; fi
          if grep -rn "from 'gi://St'\|from 'gi://Clutter'\|from 'gi://Meta'\|from 'gi://Shell'" prefs/ prefs.js; then
            echo "ERROR: prefs files import shell libs"; exit 1; fi

      - name: No deprecated imports
        run: |
          if grep -rn "imports\.misc\." $(find . -name "*.js" -not -path "./.git/*"); then
            echo "ERROR: deprecated imports"; exit 1; fi

      - name: CSS uses only /* */ comments
        run: |
          if grep -rn '^\s*//' stylesheet.css; then
            echo "ERROR: CSS uses // comments"; exit 1; fi

      - name: No try/catch in shell code
        run: |
          if grep -rn 'try\s*{' $(find . -name "*.js" -not -path "./.git/*" -not -path "./prefs/*"); then
            echo "WARNING: try/catch in shell code (review needed)"; fi

      - name: No GObject constructor JS-only properties
        run: python3 scripts/check-gobject-constructors.py

      - name: AGENTS.md skill references exist
        run: |
          MISSING=0
          for skill in extension-getting-started extension-esm-imports extension-lifecycle extension-signal-cleanup extension-gsettings extension-prefs extension-styling extension-debugging extension-review-guidelines extension-best-practices extension-metadata extension-guideline; do
            if [ ! -d "skills/$skill" ]; then echo "MISSING: skills/$skill"; MISSING=$((MISSING+1)); fi
          done
          if [ "$MISSING" -gt 0 ]; then exit 1; fi
          echo "All AGENTS.md skill references exist"

      - name: No stale feature references
        run: |
          if grep -rn "clipboard\|emoji\|Alt+1\|Alt+2\|three independent\|standalone clipboard\|standalone emoji\|just perfection\|Just Perfection" --include="*.md" --include="*.yml" --include="*.yaml" . --exclude-dir=.git --exclude-dir=skills | grep -v "three consecutive"; then
            echo "ERROR: stale references found"; exit 1; fi
          echo "No stale references"

      - name: ShellCheck bash scripts
        run: shellcheck scripts/*.sh

      - name: yamllint
        run: yamllint .github/ -c .yamllint

      - name: Summary
        run: |
          echo "=== CI Summary ==="
          echo "JS files: $(find . -name "*.js" -not -path "./.git/*" -not -path "./skills/*" | wc -l)"
          echo "Total files: $(find . -type f -not -path './.git/*' | wc -l)"
          echo "All checks passed"
