name: Lock closed issues
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  issues: write
  pull-requests: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: dessant/lock-threads@1bf7ec25051fe7c00bdd17e6a7cf3d7bfb7dc771 # v5.0.1
        with:
          github-token: ${{ github.token }}
          issue-inactive-days: 30
          pr-inactive-days: 30
          exclude-issue-created-before: ''
          exclude-any-issue-labels: 'pinned,security'
          add-issue-labels: 'locked'
          issue-comment: >
            This issue has been automatically locked since there has not been
            any recent activity after it was closed. Please open a new issue
            for related bugs.
          add-pr-labels: 'locked'
          pr-comment: >
            This pull request has been automatically locked since there has not been
            any recent activity after it was closed.
          process-only: 'issues, prs'
