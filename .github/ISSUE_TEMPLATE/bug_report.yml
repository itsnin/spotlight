name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out all required fields.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what went wrong
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact steps to trigger the issue
      placeholder: |
        1. Enable the extension
        2. Press Ctrl+Space
        3. See error
    validations:
      required: true
  - type: input
    id: gnome-version
    attributes:
      label: GNOME Shell version
      placeholder: "50"
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution
      placeholder: "Fedora 41, Arch, etc."
    validations:
      required: true
  - type: dropdown
    id: display-server
    attributes:
      label: Display server
      options:
        - Wayland
        - X11 (unsupported)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Run `journalctl -b /usr/bin/gnome-shell | grep -i spotlight`
      render: shell
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched for existing issues
          required: true
        - label: I have tested with other extensions disabled
          required: false
